[package]
name = "vtscanner"
version = "3.0.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "VTScannerPro"
path = "src/main.rs"

[dependencies]
slint = "1"
serde_json = "1"
regex = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[build-dependencies]
slint-build = "1"
cc = "1"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
